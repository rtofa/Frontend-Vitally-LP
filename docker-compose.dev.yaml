version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vitally-backend
    restart: always
    env_file:
      - ./backend/.env
    ports:
      - "8080:8080"
    networks:
      - vitally-network

  frontend:
    build:
      context: ./frontend 
      dockerfile: Dockerfile
    container_name: vitally-frontend
    restart: always
    depends_on:
      - backend 
    environment:
      NEXT_PUBLIC_API_URL: https://api.vitallyoficial.com.br/api/v1
    ports:
      - "3000:3000"
    networks:
      - vitally-network

networks:
  vitally-network:
    driver: bridge